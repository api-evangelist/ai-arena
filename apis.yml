aid: ai-arena
name: AI Arena
description: >-
  AI Arena is a web3/AI gaming company built by ArenaX Labs, backed by Paradigm
  and Framework Ventures. Its flagship title, AI Arena, is an Ethereum/Arbitrum-native
  PvP fighting game where players purchase, train through imitation learning, and
  battle characters powered by real artificial intelligence, with a native $NRN
  (Neuron) token and an on-chain marketplace for AI models. Beyond the game,
  ArenaX Labs ships developer infrastructure for reinforcement learning: RLMesh,
  an open-source, Gymnasium-compatible framework that connects RL models to
  environments across process, dependency, and machine boundaries over a gRPC
  wire protocol (rlmesh-wire-v1), with Python and Rust SDKs; and SAI
  (competesai.com), a gamified RL research and competition platform with its own
  CLI. This profile was enriched by the API Evangelist pipeline from public
  sources — GitHub, package registries, and the RLMesh documentation.
